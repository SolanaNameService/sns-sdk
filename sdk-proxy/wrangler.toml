name = "sns-sdk-proxy-v2"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat_v2"]

workers_dev = false

routes = [
  { pattern = "sdk-proxy-v2.sns.id", zone_name = "sns.id", custom_domain = true, enabled = true, previews_enabled = false }
]

[cache]
enabled = true

[vars]
CACHE_TTL_SECONDS = "120"

[[durable_objects.bindings]]
name = "TOKENIZER_CACHE"
class_name = "TokenizerCache"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TokenizerCache"]

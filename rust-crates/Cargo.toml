[workspace]
resolver = "2"
members = ["sns-sdk", "sns-cli"]

[workspace.dependencies]
solana-program = "4.0.0"
solana-sdk-ids = "3.1.0"
solana-sdk = "4.0.1"
solana-client = "4.2.2"
solana-account-decoder = { version = "4.2.2", features = ["agave-unstable-api"] }
spl-token = "9.0.0"
spl-token-2022 = "11.0.0"
spl-token-group-interface = "0.7.2"
spl-token-metadata-interface = "1.0.1"
spl-associated-token-account = "8.0.0"
spl-name-service = { package = "spl-name-service-2", version = "0.5.0" }

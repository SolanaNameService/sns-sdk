[package]
name = "sns-sdk"
version = "2.0.0"
edition = "2021"
description = "The Rust SDK provides everything you need for resolving domain ownership and records within the Solana Name Service (SNS)"
homepage = "https://www.sns.id/"
repository = "https://github.com/SolanaNameService/sns-sdk"
license = "MIT"
authors = ["SolanaNameService <contact@sns.id>"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["subdomain"]
blocking = []
devnet = ["sns-warp-common/devnet"]
subdomain = ["sub-registrar"]

[dependencies]
solana-program = { workspace = true }
solana-sdk-ids = { workspace = true }
solana-sdk = { workspace = true }
solana-client = { workspace = true }
solana-account-decoder = { workspace = true }
spl-token = { workspace = true, features = ["no-entrypoint"] }
spl-associated-token-account = { workspace = true, features = ["no-entrypoint"] }
spl-name-service = { workspace = true, features = ["no-entrypoint"] }
sns-records = { version = "0.2.0", features = ["no-entrypoint"] }
sub-registrar = { version = "0.1.0", optional = true, features = ["no-entrypoint"] }
sns-warp-common = { version = "0.2.0", features = ["solana"] }
name-tokenizer = { version = "2.1.0", features = ["no-entrypoint"] }
derive_more = "0.99.17"
ed25519-dalek = "1.0.1"
hex = "0.4.3"
borsh = "0.10.3"
bonfida-utils = "0.7.0"
bech32 = "0.9.1"
punycode = "0.4.1"
futures = "0.3.28"
bytemuck = "1.13.1"
num-derive = "0.4.0"
num-traits = "0.2.16"

[dev-dependencies]
tokio = { version = "1.26.0", features = ["full"] }
dotenv = "0.15.0"
rand = "0.8.5"
